<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src http://127.0.0.1:18758; media-src blob:; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>MNEMOSYNE / Local Companion</title><link rel="stylesheet" href="style.css"></head><body><header><small>MNEMOSYNE / CORE</small><h1>Редакционный поиск</h1><p>Интерфейс GitHub Pages. Архив и видео остаются на этом компьютере.</p></header><main><section class="panel"><h2>1. Локальный архив</h2><p>Chrome может запросить разрешение на доступ к этому компьютеру. Доступ разрешён только этому сайту.</p><button id="connect">Подключить локальный сервер</button><p id="connection">Не подключён</p></section><section id="login" class="panel" hidden><h2>2. Вход Owner</h2><label>Email <input id="email" type="email" autocomplete="email"></label><button id="send">Получить код</button><label>Код или исходная ссылка из письма <input id="otp" autocomplete="one-time-code"></label><button id="verify">Войти</button></section><section id="workspace" class="panel" hidden><h2>Поиск</h2><button id="logout">Выйти</button><label>Фраза <input id="term" value="Зубов"></label><button id="search">Найти и открыть видео</button><div id="results"></div><video id="player" controls playsinline preload="metadata" hidden></video></section><p id="status" role="status" aria-live="polite"></p></main><script src="app.js"></script></body></html>
